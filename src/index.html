    <style>
      /*
       * Shown until Angular renders; kept inline so it paints at once. Mirrors
       * pch-splash (src/app/ui/layout/splash.ts) — keep the two, and the
       * floating peaches, in step. --clock puts both on the page clock so the
       * hand-off carries on mid-pulse.
       */
      #splash {
        --bg: #f9f9f9;
        --card: #ffdbd0;
        --on-card: #7c2d13;
        --clock: 0ms;
        position: fixed;
        inset: 0;
        isolation: isolate;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        padding: 24px;
        overflow: hidden;
        text-align: center;
        font:
          16px/1.5 'Roboto Flex Variable',
          system-ui,
          sans-serif;
        color: #474747;
        background: var(--bg);
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          --bg: #131313;
          --card: #7c2d13;
          --on-card: #ffdbd0;
          color: #c6c6c6;
        }
      }
      #splash .field {
        position: absolute;
        inset: 0;
        z-index: -1;
      }
      #splash .field span {
        position: absolute;
        line-height: 1;
        translate: -50% -50%;
        filter: grayscale(1) blur(var(--blur));
        animation: splash-drift var(--duration) ease-in-out calc(var(--delay) + var(--clock))
          infinite alternate;
      }
      @keyframes splash-drift {
        from {
          transform: translate(0, 0) rotate(0deg);
        }
        to {
          transform: translate(var(--dx), var(--dy)) rotate(var(--turn));
        }
      }
      #splash .hero {
        position: relative;
        display: grid;
        place-items: center;
        width: 176px;
        height: 176px;
        margin-bottom: 8px;
      }
      #splash .glow {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(255 138 101 / 0.55) 0%,
          rgb(255 181 158 / 0.3) 40%,
          transparent 70%
        );
        animation: splash-glow 3.2s ease-in-out var(--clock) infinite;
      }
      #splash .peach {
        position: relative;
        font-size: 112px;
        line-height: 1;
        transform-origin: 50% 70%;
        animation: splash-pulse 3.2s ease-in-out var(--clock) infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1) rotate(-4deg);
          filter: drop-shadow(0 4px 8px rgb(155 68 39 / 0.25));
        }
        30% {
          transform: scale(1.14, 1.1) rotate(2deg);
          filter: drop-shadow(0 6px 18px rgb(255 120 90 / 0.55));
        }
        45% {
          transform: scale(1.07, 1.05) rotate(4deg);
        }
        62% {
          transform: scale(1.18, 1.13) rotate(1deg);
          filter: drop-shadow(0 8px 26px rgb(255 110 80 / 0.7));
        }
      }
      @keyframes splash-glow {
        0%,
        100% {
          transform: scale(0.7);
          opacity: 0.5;
        }
        30% {
          transform: scale(1);
          opacity: 0.85;
        }
        45% {
          transform: scale(0.88);
          opacity: 0.7;
        }
        62% {
          transform: scale(1.12);
          opacity: 1;
        }
      }
      #splash .note {
        box-sizing: border-box;
        max-width: 260px;
        margin: 0;
        padding: 12px 20px;
        border-radius: 16px;
        background: var(--card);
        color: var(--on-card);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.18),
          0 1px 3px 1px rgb(0 0 0 / 0.1);
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        letter-spacing: 0.1px;
        text-wrap: balance;
        animation: splash-note-in 700ms cubic-bezier(0.05, 0.7, 0.1, 1) calc(300ms + var(--clock))
          both;
      }
      @keyframes splash-note-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      /* Visually hidden until main.ts writes a start-up error into it. */
      #splash-message:not(.error) {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
      }
      app-root:not(:empty) + #splash {
        display: none;
      }
    </style>
