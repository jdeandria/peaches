@let p = peach();
@if (p) {
  <pch-page title="Profile" [maxWidth]="640">
    <pch-card class="identity" [pchStagger]="0">
      <pch-shaped-avatar
        [shapeId]="p.id"
        [name]="p.displayName"
        [size]="68"
        color="primary-container"
        foreground="on-primary-container"
      />
      <div class="identity-text">
        <h2 class="pch-title-large">{{ p.displayName }}</h2>
        <p class="pch-body-medium muted">{{ identityLine() }}</p>
      </div>
    </pch-card>

    <pch-section title="Units" />
    <pch-button-group
      [pchStagger]="1"
      label="Units"
      [options]="unitOptions"
      [selected]="p.units"
      (selectionChange)="saveUnits(p, $event)"
    />

    <pch-section title="More" />
    <pch-list-card [pchStagger]="2" class="more">
      <a pch-list-row routerLink="/exercises">
        <span rowLeading class="material-symbols-rounded icon" aria-hidden="true"
          >fitness_center</span
        >
        {{ catalogSize }} exercises
        <span rowSubtitle>Add favourites to your Crates’ libraries</span>
        <span rowTrailing class="material-symbols-rounded muted" aria-hidden="true"
          >chevron_right</span
        >
      </a>
      @if (pwa.canInstall()) {
        <button pch-list-row type="button" (click)="install()">
          <span rowLeading class="material-symbols-rounded icon" aria-hidden="true"
            >install_mobile</span
          >
          Install app
          <span rowSubtitle>Add Peaches to your home screen</span>
        </button>
      }
      @if (canSignOut()) {
        <button pch-list-row type="button" (click)="signOut()">
          <span rowLeading class="material-symbols-rounded icon" aria-hidden="true">logout</span>
          Sign out
          @if (p.email) {
            <span rowSubtitle>{{ p.email }}</span>
          }
        </button>
      }
      <pch-list-row>
        <span rowLeading class="peach" aria-hidden="true">🍑</span>
        Peaches
        <span rowSubtitle>Version {{ version }}</span>
      </pch-list-row>
    </pch-list-card>
  </pch-page>
} @else if (loading()) {
  <pch-loading-indicator class="page-loading" />
} @else {
  <pch-page title="Profile" [maxWidth]="640">
    <pch-empty-state icon="person_off" title="Not signed in" />
  </pch-page>
}
