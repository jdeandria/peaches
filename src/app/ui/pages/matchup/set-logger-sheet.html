<div class="handle" aria-hidden="true"></div>

<h2 class="pch-headline-small">{{ exercise.name }}</h2>
<p class="prescription pch-body-medium">{{ prescription }}</p>
@if (lastTime(); as last) {
  <p class="last-time pch-label-medium">
    <span class="material-symbols-rounded" aria-hidden="true">history</span>{{ last }}
  </p>
}

<ol class="sets">
  @for (i of sets; track i) {
    <li class="set" [class.weighted]="weighted">
      <span class="set-label pch-title-small">{{ setLabel(i) }}</span>
      <div class="steppers">
        <div class="stepper">
          <button
            matIconButton
            class="outlined"
            type="button"
            [matTooltip]="'Fewer ' + unit"
            [attr.aria-label]="'Fewer ' + unit + ': ' + setLabel(i)"
            (click)="nudgeValue(i, -1)"
          >
            <span class="material-symbols-rounded" aria-hidden="true">remove</span>
          </button>
          <label class="field">
            <input
              class="pch-title-large"
              inputmode="numeric"
              autocomplete="off"
              placeholder="0"
              [value]="values()[i]"
              [attr.aria-label]="setLabel(i) + ' ' + unit"
              (input)="setValue(i, $any($event.target).value)"
            />
            <span class="unit pch-label-small" aria-hidden="true">{{ unit }}</span>
          </label>
          <button
            matIconButton
            class="tonal"
            type="button"
            [matTooltip]="'More ' + unit"
            [attr.aria-label]="'More ' + unit + ': ' + setLabel(i)"
            (click)="nudgeValue(i, 1)"
          >
            <span class="material-symbols-rounded" aria-hidden="true">add</span>
          </button>
        </div>
        @if (weighted) {
          <div class="divider" aria-hidden="true"></div>
          <div class="stepper">
            <button
              matIconButton
              class="outlined"
              type="button"
              matTooltip="Lighter"
              [attr.aria-label]="'Lighter: ' + setLabel(i)"
              (click)="nudgeLoad(i, -1)"
            >
              <span class="material-symbols-rounded" aria-hidden="true">remove</span>
            </button>
            <label class="field">
              <input
                class="pch-title-large"
                inputmode="decimal"
                autocomplete="off"
                placeholder="–"
                [value]="loads()[i]"
                [attr.aria-label]="setLabel(i) + ' weight in ' + weightUnit"
                (input)="setLoad(i, $any($event.target).value)"
                (blur)="commitLoad(i, $any($event.target).value.trim())"
                (keydown.enter)="commitLoad(i, $any($event.target).value.trim())"
              />
              <span class="unit pch-label-small" aria-hidden="true">{{ weightUnit }}</span>
            </label>
            <button
              matIconButton
              class="tonal"
              type="button"
              matTooltip="Heavier"
              [attr.aria-label]="'Heavier: ' + setLabel(i)"
              (click)="nudgeLoad(i, 1)"
            >
              <span class="material-symbols-rounded" aria-hidden="true">add</span>
            </button>
          </div>
        }
      </div>
    </li>
  }
</ol>

<h3 id="pch-rpe-label" class="pch-title-small">How hard was it? (RPE)</h3>
<pch-button-group
  aria-labelledby="pch-rpe-label"
  [options]="rpeOptions"
  [(selected)]="rpe"
  allowDeselect
/>

<div class="actions">
  <button matButton="outlined" type="button" (click)="fillPrescribed()">
    <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
    As prescribed
  </button>
  <button matButton="filled" type="button" class="save" (click)="save()">Save</button>
</div>
