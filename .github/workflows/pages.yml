name: Demo on GitHub Pages

# Builds the in-memory demo (no backend, seeded data) and publishes it to
# the gh-pages branch, served at https://<owner>.github.io/<repo>/.
#
# One-time setup: Settings → Pages → Build and deployment →
# Source "Deploy from a branch", branch "gh-pages", folder "/ (root)".
# Private repositories need a paid GitHub plan for Pages, and the
# published site is public even when the repository is private.

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build demo and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web demo
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
      - name: Publish build/web to gh-pages
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          cd build/web
          # Serve files as-is (no Jekyll processing).
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo build of ${SOURCE_REF} @ ${SOURCE_SHA}"
          # Force-push a single commit: the branch only ever holds the
          # latest build, so history does not grow with every deploy.
          git push -q -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
      - name: Summary
        run: |
          echo "Published ${GITHUB_REF_NAME} to gh-pages." >> "$GITHUB_STEP_SUMMARY"
          echo "Live at https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/ once Pages is enabled." >> "$GITHUB_STEP_SUMMARY"
